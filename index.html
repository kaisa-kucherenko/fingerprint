<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

  body { font-family: 'SF Mono', 'Fira Code', monospace; background: #0d1117; color: #c9d1d9; padding: 16px; }
  h1 { font-size: 18px; color: #58a6ff; margin-bottom: 12px; }

  button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px;
           padding: 8px 16px; cursor: pointer; font-family: inherit; font-size: 13px; }
  button:hover { background: #30363d; border-color: #58a6ff; }
  button:active { background: #388bfd26; }
  .section { margin-bottom: 16px; border: 1px solid #21262d; border-radius: 8px; overflow: hidden; }
  .section-header { background: #161b22; padding: 10px 14px; font-size: 14px; font-weight: 600;
                    color: #58a6ff; cursor: pointer; display: flex; justify-content: space-between; }
  .section-header:hover { background: #1c2128; }
  .section-body { padding: 8px 14px; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #21262d14; font-size: 12px; }
  .row:last-child { border-bottom: none; }
  .key { color: #8b949e; min-width: 280px; }
  .val { color: #7ee787; text-align: right; word-break: break-all; max-width: 60%; }
  .val.warn { color: #f0883e; }
  .val.fail { color: #f85149; }
  .val.ok { color: #7ee787; }
  #json-output { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px;
                 font-size: 11px; max-height: 400px; overflow: auto; white-space: pre-wrap; word-break: break-all;
                 display: none; margin-top: 12px; }
</style>
</head>
<body>
<h1>Browser Fingerprint</h1>
<div class="controls">
  <button onclick="copyJSON()">Copy JSON</button>
  <button onclick="saveJSON()">Save JSON</button>
  <button onclick="toggleRaw()">Show/Hide Raw JSON</button>
</div>
<div id="results"></div>
<div id="json-output"></div>
<!-- programmatic access: document.getElementById('fingerprint-json').textContent -->
<div id="fingerprint-json" style="display:none"></div>

<script>
const fp = {};

function safe(fn) { try { return fn(); } catch(e) { return 'ERROR: ' + e.message; } }

// ── 1. Navigator ──
function collectNavigator() {
  const n = navigator;
  return {
    'navigator.webdriver': safe(() => n.webdriver),
    'navigator.hardwareConcurrency': safe(() => n.hardwareConcurrency),
    'navigator.maxTouchPoints': safe(() => n.maxTouchPoints),
    'navigator.deviceMemory': safe(() => n.deviceMemory),
    'navigator.languages': safe(() => JSON.stringify(n.languages)),
    'navigator.userAgent': safe(() => n.userAgent),
    'navigator.platform': safe(() => n.platform),
    'navigator.vendor': safe(() => n.vendor),
    'navigator.language': safe(() => n.language),
    'navigator.cookieEnabled': safe(() => n.cookieEnabled),
    'navigator.pdfViewerEnabled': safe(() => n.pdfViewerEnabled),
    'navigator.plugins.length': safe(() => n.plugins.length),
    'navigator.mimeTypes.length': safe(() => n.mimeTypes.length),
    'navigator.plugins[0]?.name': safe(() => n.plugins[0]?.name),
    'navigator.appCodeName': safe(() => n.appCodeName),
    'navigator.appName': safe(() => n.appName),
    'navigator.appVersion': safe(() => n.appVersion),
    'navigator.product': safe(() => n.product),
    'navigator.productSub': safe(() => n.productSub),
    'navigator.onLine': safe(() => n.onLine),
    'navigator.doNotTrack': safe(() => n.doNotTrack),
    'navigator.sendBeacon': safe(() => typeof n.sendBeacon),
    'navigator.ink': safe(() => typeof n.ink),
    'navigator.webkitTemporaryStorage': safe(() => typeof n.webkitTemporaryStorage),
    'navigator.updateAdInterestGroups': safe(() => typeof n.updateAdInterestGroups),
  };
}

// ── 2. User-Agent Data ──
function collectUserAgentData() {
  const ua = navigator.userAgentData;
  return {
    'navigator.userAgentData exists': safe(() => !!ua),
    'userAgentData.mobile': safe(() => ua?.mobile),
    'userAgentData.platform': safe(() => ua?.platform),
    'userAgentData.brands': safe(() => JSON.stringify(ua?.brands)),
  };
}

// ── 2b. UA High Entropy (async) ──
async function collectUAHighEntropy() {
  const result = {};
  try {
    const ua = navigator.userAgentData;
    if (!ua?.getHighEntropyValues) {
      result['getHighEntropyValues'] = 'not available';
      return result;
    }
    const he = await ua.getHighEntropyValues([
      'architecture', 'bitness', 'model', 'platformVersion',
      'uaFullVersion', 'fullVersionList', 'wow64',
    ]);
    result['highEntropy.architecture'] = he.architecture;
    result['highEntropy.bitness'] = he.bitness;
    result['highEntropy.model'] = he.model;
    result['highEntropy.platformVersion'] = he.platformVersion;
    result['highEntropy.uaFullVersion'] = he.uaFullVersion;
    result['highEntropy.wow64'] = he.wow64;
    result['highEntropy.fullVersionList'] = JSON.stringify(he.fullVersionList);
  } catch(e) {
    result['highEntropy.error'] = e.message;
  }
  return result;
}

// ── 3. Screen & Window ──
function collectScreen() {
  return {
    'screen.width': safe(() => screen.width),
    'screen.height': safe(() => screen.height),
    'screen.availWidth': safe(() => screen.availWidth),
    'screen.availHeight': safe(() => screen.availHeight),
    'screen.availLeft': safe(() => screen.availLeft),
    'screen.availTop': safe(() => screen.availTop),
    'screen.colorDepth': safe(() => screen.colorDepth),
    'screen.pixelDepth': safe(() => screen.pixelDepth),
    'window.outerWidth': safe(() => window.outerWidth),
    'window.outerHeight': safe(() => window.outerHeight),
    'window.innerWidth': safe(() => window.innerWidth),
    'window.innerHeight': safe(() => window.innerHeight),
    'window.devicePixelRatio': safe(() => window.devicePixelRatio),
    'window.screenX': safe(() => window.screenX),
    'window.screenY': safe(() => window.screenY),
    'window.parent === window': safe(() => window.parent === window),
    'window.self === window': safe(() => window.self === window),
    'screen.orientation.type': safe(() => screen.orientation?.type),
    'screen.orientation.angle': safe(() => screen.orientation?.angle),
  };
}

// ── 4. Performance & Timing ──
function collectPerformance() {
  const nav = performance.getEntriesByType('navigation')[0] || {};
  return {
    'performance.memory.jsHeapSizeLimit': safe(() => performance.memory?.jsHeapSizeLimit),
    'performance.memory.totalJSHeapSize': safe(() => performance.memory?.totalJSHeapSize),
    'performance.memory.usedJSHeapSize': safe(() => performance.memory?.usedJSHeapSize),
    'navTiming.responseStart': safe(() => nav.responseStart),
    'navTiming.requestStart': safe(() => nav.requestStart),
    'navTiming.connectEnd': safe(() => nav.connectEnd),
    'navTiming.connectStart': safe(() => nav.connectStart),
    'navTiming.domainLookupEnd': safe(() => nav.domainLookupEnd),
    'navTiming.domainLookupStart': safe(() => nav.domainLookupStart),
    'navTiming.fetchStart': safe(() => nav.fetchStart),
    'navTiming.responseEnd': safe(() => nav.responseEnd),
    'performance.timeOrigin': safe(() => performance.timeOrigin),
    'navTiming.type': safe(() => nav.type),
    'navTiming.redirectCount': safe(() => nav.redirectCount),
  };
}

// ── 5. Connection / Network ──
function collectConnection() {
  const c = navigator.connection;
  return {
    'navigator.connection exists': safe(() => !!c),
    'connection.effectiveType': safe(() => c?.effectiveType),
    'connection.rtt': safe(() => c?.rtt),
    'connection.downlink': safe(() => c?.downlink),
    'connection.saveData': safe(() => c?.saveData),
    'connection.type': safe(() => c?.type),
    'connection.constructor.name': safe(() => c?.constructor?.name),
    'connection instanceof NetworkInformation': safe(() => c instanceof NetworkInformation),
    'connection getter location': safe(() => {
      const d = Object.getOwnPropertyDescriptor(Navigator.prototype, 'connection');
      return d ? 'prototype' : (Object.getOwnPropertyDescriptor(navigator, 'connection') ? 'instance' : 'none');
    }),
  };
}

// ── 6. Chrome & History ──
function collectChrome() {
  return {
    'window.chrome': safe(() => typeof window.chrome),
    'window.chrome.csi': safe(() => typeof window.chrome?.csi),
    'window.chrome.loadTimes': safe(() => typeof window.chrome?.loadTimes),
    'window.chrome.runtime': safe(() => typeof window.chrome?.runtime),
    'chrome.csi.toString()': safe(() => window.chrome?.csi?.toString()),
    'chrome.loadTimes.toString()': safe(() => window.chrome?.loadTimes?.toString()),
    'chrome.csi()': safe(() => JSON.stringify(window.chrome?.csi?.())),
    'chrome.csi() startE descriptor': safe(() => {
      const obj = window.chrome?.csi?.();
      if (!obj) return 'null';
      const d = Object.getOwnPropertyDescriptor(obj, 'startE');
      return d ? JSON.stringify({hasGet: !!d.get, hasSet: !!d.set, hasValue: 'value' in d, enum: d.enumerable, conf: d.configurable}) : 'no descriptor';
    }),
    'chrome.loadTimes()': safe(() => JSON.stringify(window.chrome?.loadTimes?.())),
    'chrome.loadTimes() requestTime descriptor': safe(() => {
      const obj = window.chrome?.loadTimes?.();
      if (!obj) return 'null';
      const d = Object.getOwnPropertyDescriptor(obj, 'requestTime');
      return d ? JSON.stringify({hasGet: !!d.get, hasSet: !!d.set, hasValue: 'value' in d, enum: d.enumerable, conf: d.configurable}) : 'no descriptor';
    }),
    'chrome on Window.prototype': safe(() => Window.prototype.hasOwnProperty('chrome')),
    'chrome own property': safe(() => window.hasOwnProperty('chrome')),
    'chrome.csi.name': safe(() => window.chrome?.csi?.name),
    'chrome.loadTimes.name': safe(() => window.chrome?.loadTimes?.name),
    'history.length': safe(() => history.length),
    'window.isSecureContext': safe(() => window.isSecureContext),
    'window.trustedTypes': safe(() => typeof window.trustedTypes),
    'trustedTypes.emptyHTML': safe(() => typeof window.trustedTypes?.emptyHTML),
    'typeof Number': safe(() => typeof Number),
    'typeof Function': safe(() => typeof Function),
    'typeof Date': safe(() => typeof Date),
    'typeof Object': safe(() => typeof Object),
    'typeof Math': safe(() => typeof Math),
    'typeof Array': safe(() => typeof Array),
  };
}

// ── 7. Automation Markers ──
function collectAutomation() {
  return {
    'navigator.webdriver': safe(() => navigator.webdriver),
    'Navigator.prototype webdriver getter': safe(() => {
      const d = Object.getOwnPropertyDescriptor(Navigator.prototype, 'webdriver');
      return d ? '{get: ' + typeof d.get + ', configurable: ' + d.configurable + '}' : 'undefined';
    }),
    'window.webdriver': safe(() => window.webdriver),
    'document.__webdriver_script_fn': safe(() => document.__webdriver_script_fn),
    'document.$cdc_asdjflasutopfhvcZLmcfl_': safe(() => document.$cdc_asdjflasutopfhvcZLmcfl_),
    'document.$wdc_': safe(() => document.$wdc_),
    'documentElement.hasAttribute("webdriver")': safe(() => document.documentElement.hasAttribute('webdriver')),
    'window.domAutomationController': safe(() => window.domAutomationController),
    'window.callPhantom': safe(() => window.callPhantom),
    'window.boundObject': safe(() => window.boundObject),
    'window.cefsharp_CreatePromise': safe(() => window.cefsharp_CreatePromise),
    'window.__nightmare': safe(() => window.__nightmare),
    'window.Cypress': safe(() => window.Cypress),
    'window.awesomium': safe(() => window.awesomium),
    'window.____LocationIntercept': safe(() => window.____LocationIntercept),
    'window.windmill': safe(() => window.windmill),
    'window.ubot': safe(() => window.ubot),
    'window.__playwright__binding__': safe(() => window.__playwright__binding__),
    'window.__pwInitScripts': safe(() => window.__pwInitScripts),
    'window.opener': safe(() => window.opener),
  };
}

// ── 8. Click Trust Test ──
function collectClickTrust() {
  return new Promise(resolve => {
    const a = document.createElement('a');
    a.href = '#';
    a.style.position = 'fixed'; a.style.left = '-9999px';
    document.body.appendChild(a);
    let trusted = null;
    a.onclick = (e) => { trusted = e.isTrusted; e.preventDefault(); };
    a.click();
    document.body.removeChild(a);
    resolve({ 'PointerEvent.isTrusted (programmatic click)': trusted });
  });
}

// ── 9. Permissions.query ──
async function collectPermissions() {
  const result = {
    'typeof Permissions': safe(() => typeof Permissions),
    'typeof Permissions.prototype.query': safe(() => typeof Permissions.prototype?.query),
  };
  try {
    const status = await navigator.permissions.query({name: 'notifications'});
    result['Permissions.query({name:"notifications"})'] = status.state;
  } catch(e) {
    result['Permissions.query({name:"notifications"})'] = 'ERROR: ' + e.message;
  }
  return result;
}

// ── 10. iframe srcdoc cross-origin test ──
function collectIframeTest() {
  return new Promise(resolve => {
    const result = {};
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    if (window.trustedTypes?.emptyHTML !== undefined) {
      iframe.srcdoc = window.trustedTypes.emptyHTML;
    } else {
      iframe.srcdoc = '';
    }
    document.body.appendChild(iframe);
    setTimeout(() => {
      result['iframe.contentWindow exists'] = safe(() => !!iframe.contentWindow);
      result['iframe.contentWindow.chrome'] = safe(() => typeof iframe.contentWindow?.chrome);
      result['iframe.contentWindow.chrome.csi'] = safe(() => typeof iframe.contentWindow?.chrome?.csi);
      result['iframe.contentWindow.chrome.csi()'] = safe(() => JSON.stringify(iframe.contentWindow?.chrome?.csi?.()));
      result['iframe.contentWindow.chrome.csi() descriptor'] = safe(() => {
        const obj = iframe.contentWindow?.chrome?.csi?.();
        if (!obj) return 'null';
        const d = Object.getOwnPropertyDescriptor(obj, 'startE');
        return d ? JSON.stringify({hasGet: !!d.get, hasSet: !!d.set, hasValue: 'value' in d}) : 'no descriptor';
      });
      result['iframe.contentWindow.chrome.runtime'] = safe(() => typeof iframe.contentWindow?.chrome?.runtime);
      result['iframe.contentWindow.navigator.webdriver'] = safe(() => iframe.contentWindow?.navigator?.webdriver);
      result['iframe.contentWindow.navigator.plugins.length'] = safe(() => iframe.contentWindow?.navigator?.plugins?.length);
      document.body.removeChild(iframe);
      resolve(result);
    }, 100);
  });
}

// ── 10b. iframe Hardware Consistency ──
function collectIframeHardware() {
  const PROPS = [
    {key: 'navigator.hardwareConcurrency', get: w => w.navigator.hardwareConcurrency},
    {key: 'navigator.deviceMemory', get: w => w.navigator.deviceMemory},
    {key: 'navigator.platform', get: w => w.navigator.platform},
    {key: 'navigator.maxTouchPoints', get: w => w.navigator.maxTouchPoints},
    {key: 'navigator.webdriver', get: w => w.navigator.webdriver},
    {key: 'navigator.languages', get: w => JSON.stringify(w.navigator.languages)},
    {key: 'navigator.vendor', get: w => w.navigator.vendor},
    {key: 'navigator.appVersion', get: w => w.navigator.appVersion},
    {key: 'navigator.plugins.length', get: w => w.navigator.plugins.length},
    {key: 'navigator.mimeTypes.length', get: w => w.navigator.mimeTypes.length},
    {key: 'navigator.connection?.rtt', get: w => w.navigator.connection?.rtt},
    {key: 'navigator.connection?.downlink', get: w => w.navigator.connection?.downlink},
    {key: 'navigator.connection?.effectiveType', get: w => w.navigator.connection?.effectiveType},
    {key: 'screen.width', get: w => w.screen.width},
    {key: 'screen.height', get: w => w.screen.height},
    {key: 'screen.colorDepth', get: w => w.screen.colorDepth},
    {key: 'WebGL renderer', get: w => {
      const c = w.document.createElement('canvas');
      const gl = c.getContext('webgl');
      return gl ? gl.getParameter(37446) : 'no webgl';
    }},
    {key: 'WebGL vendor', get: w => {
      const c = w.document.createElement('canvas');
      const gl = c.getContext('webgl');
      return gl ? gl.getParameter(37445) : 'no webgl';
    }},
    {key: 'performance.memory?.jsHeapSizeLimit', get: w => w.performance.memory?.jsHeapSizeLimit},
  ];

  // ifrVals: values a frame read about itself and posted back, for a frame the parent cannot reach.
  function compareWindow(iframeName, iframeWin, result, ifrVals) {
    PROPS.forEach(p => {
      const k = iframeName + ' → ' + p.key;
      try {
        const mainVal = p.get(window);
        const ifrVal = ifrVals ? frameValue(ifrVals[p.key]) : p.get(iframeWin);
        const mainStr = String(mainVal);
        const ifrStr = String(ifrVal);
        if (mainStr === ifrStr) {
          result[k] = mainStr + ' → CONSISTENT';
        } else {
          result[k] = mainStr + ' vs ' + ifrStr + ' → SPOOFED';
          result[k] = {toString() { return mainStr + ' vs ' + ifrStr + ' → SPOOFED'; }, _fail: true};
        }
      } catch(e) {
        result[k] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
      }
    });
  }

  function frameValue(v) {
    if (!v || 'e' in v) throw new Error(v ? v.e : 'no value from the frame');
    return v.v;
  }

  function advancedChecks(iframeName, iframeWin, result, mainStr) {
    // Prototype chain check — hardwareConcurrency should be on prototype, not instance
    const k1 = iframeName + ' → hardwareConcurrency prototype check';
    try {
      const desc = Object.getOwnPropertyDescriptor(iframeWin.Navigator.prototype, 'hardwareConcurrency');
      const instDesc = Object.getOwnPropertyDescriptor(iframeWin.navigator, 'hardwareConcurrency');
      if (instDesc) {
        result[k1] = {toString() { return 'FAIL: overridden on instance'; }, _fail: true};
      } else if (desc && desc.get) {
        result[k1] = 'PASS: getter on prototype';
      } else {
        result[k1] = {toString() { return 'WARN: no getter found'; }, _warn: true};
      }
    } catch(e) {
      result[k1] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
    }

    // toString native check
    const k2 = iframeName + ' → hardwareConcurrency toString native';
    try {
      const desc = Object.getOwnPropertyDescriptor(iframeWin.Navigator.prototype, 'hardwareConcurrency');
      const str = desc?.get?.toString() || '';
      if (str.includes('[native code]')) {
        result[k2] = 'PASS: [native code]';
      } else {
        result[k2] = {toString() { return 'FAIL: not [native code]'; }, _fail: true};
      }
    } catch(e) {
      result[k2] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
    }

    // hasOwnProperty check — should be inherited, not own
    const k3 = iframeName + ' → hardwareConcurrency hasOwnProperty';
    try {
      const hasOwn = iframeWin.navigator.hasOwnProperty('hardwareConcurrency');
      if (hasOwn) {
        result[k3] = {toString() { return 'FAIL: own property (should be inherited)'; }, _fail: true};
      } else {
        result[k3] = 'PASS: inherited from prototype';
      }
    } catch(e) {
      result[k3] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
    }

    // Function.prototype.toString integrity
    const k4 = iframeName + ' → Function.prototype.toString integrity';
    try {
      const ifrStr = iframeWin.Function.prototype.toString.toString();
      if (mainStr === undefined) mainStr = Function.prototype.toString.toString();
      if (ifrStr === mainStr) {
        result[k4] = 'PASS: matches main window';
      } else {
        result[k4] = {toString() { return 'FAIL: ' + ifrStr; }, _fail: true};
      }
    } catch(e) {
      result[k4] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
    }
  }

  function createIframe(opts) {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    if (opts.sandbox) iframe.sandbox = opts.sandbox;
    if (opts.srcdoc !== undefined) iframe.srcdoc = opts.srcdoc;
    if (opts.src) iframe.src = opts.src;
    document.body.appendChild(iframe);
    return iframe;
  }

  return new Promise(resolve => {
    const result = {};
    const iframes = [];

    // 1. srcdoc iframe
    const srcdocIf = createIframe({srcdoc: '<html><body><script><\/script></body></html>'});
    iframes.push(srcdocIf);

    // 2. blank iframe
    const blankIf = createIframe({src: 'about:blank'});
    iframes.push(blankIf);

    // 3. dynamically appended iframe (read immediately — race condition test)
    const dynIf = createIframe({});
    iframes.push(dynIf);
    try {
      compareWindow('dynamic iframe (immediate)', dynIf.contentWindow, result);
    } catch(e) {
      result['dynamic iframe (immediate) → access'] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
    }

    // 4. sandbox iframe — opaque origin, so the parent cannot read it; the frame runs the same
    // reads on itself and posts the values back.
    // Building it stringifies functions, which a patched toString can make throw.
    let sandboxProbe;
    try {
      sandboxProbe = `try {
const PROPS = [${PROPS.map(p => `{key: ${JSON.stringify(p.key)}, get: ${p.get}}`).join(',\n')}];
${advancedChecks}
const vals = {};
for (const p of PROPS) {
  try { vals[p.key] = {v: String(p.get(window))}; } catch (e) { vals[p.key] = {e: String(e && e.message)}; }
}
const r = {};
advancedChecks('sandbox iframe', window, r, ${JSON.stringify(Function.prototype.toString.toString())});
const adv = {};
for (const k in r) adv[k] = {t: String(r[k]), fail: !!r[k]._fail, warn: !!r[k]._warn};
parent.postMessage({fpSandbox: true, vals, adv}, '*');
} catch (e) { parent.postMessage({fpSandbox: true, error: String(e && e.message)}, '*'); }`;
    } catch (e) {
      const why = JSON.stringify('probe not built: ' + errorText(e)).replace(/</g, '\\u003c');
      sandboxProbe = `parent.postMessage({fpSandbox: true, error: ${why}}, '*');`;
    }
    const sandboxIf = createIframe({sandbox: 'allow-scripts', srcdoc: '<html><body><script>' + sandboxProbe + '<\/script></body></html>'});
    iframes.push(sandboxIf);
    const sandboxMsg = new Promise(res => {
      const onMsg = e => {
        if (e.source !== sandboxIf.contentWindow || !e.data || !e.data.fpSandbox) return;
        window.removeEventListener('message', onMsg);
        res(e.data);
      };
      window.addEventListener('message', onMsg);
      setTimeout(() => { window.removeEventListener('message', onMsg); res(null); }, 1000);
    });

    // 5. nested iframe — outer srcdoc creates inner iframe
    const nestedOuter = createIframe({srcdoc: '<html><body><iframe id="inner" srcdoc="<html><body><script><\\/script></body></html>"></iframe><script><\/script></body></html>'});
    iframes.push(nestedOuter);

    setTimeout(async () => {
      // srcdoc
      try {
        compareWindow('srcdoc iframe', srcdocIf.contentWindow, result);
        advancedChecks('srcdoc iframe', srcdocIf.contentWindow, result);
      } catch(e) {
        result['srcdoc iframe → access'] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
      }

      // blank
      try {
        compareWindow('blank iframe', blankIf.contentWindow, result);
        advancedChecks('blank iframe', blankIf.contentWindow, result);
      } catch(e) {
        result['blank iframe → access'] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
      }

      // dynamic (delayed read — compare with immediate read above)
      try {
        compareWindow('dynamic iframe (delayed)', dynIf.contentWindow, result);
      } catch(e) {
        result['dynamic iframe (delayed) → access'] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
      }

      // sandbox
      const sb = await sandboxMsg;
      let why = !sb ? 'no message from the frame within 1000 ms' : 'error' in sb ? 'frame: ' + sb.error : null;
      if (!why) {
        try {
          compareWindow('sandbox iframe', null, result, sb.vals);
          for (const [k, a] of Object.entries(sb.adv)) {
            if (!a.fail && !a.warn) { result[k] = a.t; continue; }
            const v = {toString() { return a.t; }};
            if (a.fail) v._fail = true;
            if (a.warn) v._warn = true;
            result[k] = v;
          }
        } catch (e) {
          why = errorText(e);
        }
      }
      // On failure every sandbox key is still written, BLOCKED, in its usual order.
      if (why) {
        const blocked = {e: why};
        compareWindow('sandbox iframe', null, result, Object.fromEntries(PROPS.map(p => [p.key, blocked])));
        advancedChecks('sandbox iframe', new Proxy({}, {get() { throw new Error(why); }}), result);
      }

      // nested — wait extra for inner iframe
      setTimeout(() => {
        try {
          const innerIf = nestedOuter.contentWindow.document.getElementById('inner');
          if (innerIf && innerIf.contentWindow) {
            compareWindow('nested iframe (inner)', innerIf.contentWindow, result);
            advancedChecks('nested iframe (inner)', innerIf.contentWindow, result);
          } else {
            result['nested iframe → inner access'] = {toString() { return 'BLOCKED: inner iframe not found'; }, _warn: true};
          }
        } catch(e) {
          result['nested iframe → access'] = {toString() { return 'BLOCKED: ' + e.message; }, _warn: true};
        }

        // Worker parallelism test
        try {
          const claimed = navigator.hardwareConcurrency || 4;
          const workerCount = Math.min(claimed, 8);
          const workerCode = `
            onmessage = function() {
              const start = performance.now();
              while (performance.now() - start < 200) { Math.random(); }
              postMessage(performance.now() - start);
            };
          `;
          const blob = new Blob([workerCode], {type: 'application/javascript'});
          const url = URL.createObjectURL(blob);
          const workers = [];
          const times = [];
          let done = 0;

          for (let i = 0; i < workerCount; i++) {
            const w = new Worker(url);
            workers.push(w);
            w.onmessage = function(e) {
              times.push(e.data);
              done++;
              if (done === workerCount) {
                workers.forEach(wk => wk.terminate());
                URL.revokeObjectURL(url);
                const avgTime = times.reduce((a, b) => a + b, 0) / times.length;
                // If truly parallel, avg ~200ms. If serialized, avg ~200ms * N / cores
                const effectiveCores = Math.round((200 / avgTime) * workerCount * 10) / 10;
                if (Math.abs(effectiveCores - claimed) <= 1.5) {
                  result['Worker parallelism test'] = 'Claimed: ' + claimed + ', Measured: ' + effectiveCores + ' → CONSISTENT';
                } else {
                  result['Worker parallelism test'] = {
                    toString() { return 'Claimed: ' + claimed + ', Measured: ' + effectiveCores + ' → MISMATCH'; },
                    _fail: true
                  };
                }
                // cleanup iframes
                iframes.forEach(f => { try { document.body.removeChild(f); } catch(e) {} });
                resolve(result);
              }
            };
          }
          workers.forEach(w => w.postMessage('go'));
        } catch(e) {
          result['Worker parallelism test'] = {toString() { return 'ERROR: ' + e.message; }, _warn: true};
          iframes.forEach(f => { try { document.body.removeChild(f); } catch(e2) {} });
          resolve(result);
        }
      }, 150);
    }, 150);
  });
}

  // A phone in desktop mode claims X11 Linux but keeps its touch points.
  else if (os === 'linux' && /X11/.test(ua) && touch > 0) type = 'pcmode';
  const m = re => (ua.match(re) || [])[1];
  let browser = 'unknown', ver;
  if ((ver = m(/Edg(?:A|iOS)?\/(\d+)/))) browser = 'edge';
  else if ((ver = m(/(?:OPR|OPT)\/(\d+)/))) browser = 'opera';
  else if ((ver = m(/SamsungBrowser\/(\d+)/))) browser = 'samsung';
  else if ((ver = m(/YaBrowser\/(\d+)/))) browser = 'yandex';
  else if ((ver = m(/(?:Firefox|FxiOS)\/(\d+)/))) browser = 'firefox';
  else if ((ver = m(/(?:CriOS|Chrome)\/(\d+)/))) browser = 'chrome';
  else if ((ver = m(/Version\/(\d+)[\d.]*(?: Mobile\/\S+)? Safari\//))) browser = 'safari';
  return [type, os, browser + (ver || '')].join('_');
}

// ── Render ──
function renderSection(title, data, container, collapsed) {
  const section = document.createElement('div');
  section.className = 'section';
  const count = Object.keys(data).length;
  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML = title + ' <span style="color:#8b949e">' + count + ' checks</span>';
  header.onclick = function() { body.style.display = body.style.display === 'none' ? '' : 'none'; };
  const body = document.createElement('div');
  body.className = 'section-body';
  for (const [k, v] of Object.entries(data)) {
    const row = document.createElement('div');
    row.className = 'row';
    const valStr = v === undefined ? 'undefined' : v === null ? 'null' : String(v);
    let cls = 'val';
    if (v && v._fail) cls += ' fail';
    else if (v && v._warn) cls += ' warn';
    else if (v === false || v === undefined || v === null || (typeof v === 'string' && v.startsWith('ERROR'))) cls += ' fail';
    else if (v === true || (typeof v === 'string' && (v.includes('CONSISTENT') || v.startsWith('PASS')))) cls += ' ok';
    else if (typeof v === 'string' && v.includes('SPOOFED')) cls += ' fail';
    else if (typeof v === 'string' && v.startsWith('BLOCKED')) cls += ' warn';
    row.innerHTML = '<span class="key">' + k + '</span><span class="' + cls + '">' + valStr + '</span>';
    body.appendChild(row);
  }
  if (collapsed) body.style.display = 'none';
  section.appendChild(header);
  section.appendChild(body);
  container.appendChild(section);
}

// ── Main ──
async function runAll() {
  const container = document.getElementById('results');
  container.innerHTML = '';

  // async collectors
  const [clickTrust, permissions, iframeTest, iframeHw, uaHighEntropy, mediaDevices] = await Promise.all([
    collectClickTrust(),
    collectPermissions(),
    collectIframeTest(),
    collectIframeHardware(),
    collectUAHighEntropy(),
    collectMediaDevices(),
  ]);

  const sections = [
    ['Navigator', collectNavigator()],
    ['User-Agent Data', collectUserAgentData()],
    ['UA High Entropy', uaHighEntropy],
    ['Screen & Window', collectScreen()],
    ['Performance & Timing', collectPerformance()],
    ['Connection / Network', collectConnection()],
    ['Chrome & History', collectChrome()],
    ['Automation Markers', collectAutomation()],
    ['Click Trust Test', clickTrust],
    ['Permissions', permissions],
    ['iframe Cross-Origin Test', iframeTest],
    ['iframe Hardware Consistency', iframeHw],
    ['toString() Integrity', collectToString()],
    ['Plugins & Codecs', collectMediaCodecs()],
    ['Plugins Detail', collectPluginsDetail()],
    ['Prototype Integrity', collectPrototypeIntegrity()],
    ['Prototype Probes', collectPrototypeProbes()],
    ['Navigator Getter CALL Test', collectNavigatorGetterCalls()],
    ['div+CSS Probe', collectDivCSSProbe()],
    ['MouseEvent Probe', collectMouseEventProbe()],
    ['Document & Environment', collectEnvironment()],
    ['Media Devices', mediaDevices],
    ['API Presence', collectAPIPresence()],
  ];

  // fp is filled in one step at the end, so Save / Copy never export a half-collected dump.
  const dump = {};
  for (const [title, data] of sections) {
    renderSection(title, data, container);
    Object.assign(dump, data);
  }

  // Started only after the checks above finish, so their timing stays as it was; their iframes are gone by now.
  const classes = collectWindowClasses();
  const windowKeys = collectWindowKeys();
  const extra = await collectExtraSurfaces();
  const descriptors = await collectDescriptors();
  const added = [
    ['Extra surfaces (ks.*)', extra],
    ['Window classes and globals (ks.*)', classes],
    ['Descriptors and media (inj.*)', Object.assign(windowKeys, descriptors)],
  ];
  for (const [title, data] of added) {
    renderSection(title, data, container, true);
    Object.assign(dump, data);
  }

  Object.keys(fp).forEach(k => delete fp[k]);
  Object.assign(fp, dump);
  fp._timestamp = new Date().toISOString();
  fp._url = location.href;
  fp._userAgent = navigator.userAgent;

  // fill both outputs
  document.getElementById('json-output').textContent = JSON.stringify(fp, null, 2);
  document.getElementById('fingerprint-json').textContent = JSON.stringify(fp);
}

function copyJSON() {
  const text = JSON.stringify(fp, null, 2);
  navigator.clipboard.writeText(text).then(function() { alert('Copied!'); }).catch(function() {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied!');
  });
}

function saveJSON() {
  const blob = new Blob([JSON.stringify(fp, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fingerprint_' + Date.now() + '_' + deviceTag(fp) + '.json';
  a.click();
}

function toggleRaw() {
  const el = document.getElementById('json-output');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// auto-run on page load
runAll();
</script>
